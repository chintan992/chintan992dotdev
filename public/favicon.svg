<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="cr-chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1d22" />
      <stop offset="100%" stop-color="#0e1013" />
    </linearGradient>
    <linearGradient id="cr-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>
  </defs>

  <!-- Industrial Chassis Frame -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#cr-chassis)" stroke="url(#cr-bevel)" stroke-width="1.5" />

  <!-- Viewfinder Reticle Corners -->
  <g stroke="rgba(255,255,255,0.3)" stroke-width="1.25" stroke-linecap="round" fill="none">
    <path d="M 6.5 10.5 V 6.5 H 10.5" />
    <path d="M 37.5 6.5 H 41.5 V 10.5" />
    <path d="M 6.5 37.5 V 41.5 H 10.5" />
    <path d="M 37.5 41.5 H 41.5 V 37.5" />
  </g>

  <!-- "C" Glyph -->
  <path
    d="M 23 15.5 H 17.5 C 13.8 15.5 11 18.8 11 24 C 11 29.2 13.8 32.5 17.5 32.5 H 23"
    fill="none"
    stroke="#f1f5f9"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- "R" Glyph -->
  <g fill="none" stroke="#f1f5f9" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 27 15.5 V 32.5" />
    <path d="M 27 15.5 H 32.5 C 35.2 15.5 37 17.3 37 20 C 37 22.7 35.2 24.5 32.5 24.5 H 27" />
    <path d="M 31.8 24.5 L 37 32.5" />
  </g>

  <!-- Optical Telemetry Aperture Point -->
  <circle cx="39" cy="9" r="2.2" fill="#38bdf8" />
</svg>
